[project]
name = "aiflow-demo"
version = "0.1.0"
description = "Sample project for demoing AI agent-team workflows and GitHub merge governance."
requires-python = ">=3.10"

[project.optional-dependencies]
# AI test-case document generator (src/aiflow_demo/qa_testcases). Installed by the
# qa-testcases workflow; python-docx is also needed by the CI tests/coverage jobs.
qa-testcases = ["anthropic", "python-docx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
# Maintainability + reliability gate — SonarQube-style bug & smell rules that
# CodeQL (security) and Bandit (security) do NOT catch. Enforced by the `lint`
# job in .github/workflows/lint.yml (ruff check src).
select = [
    # complexity / "too many ..." (Sonar S107 / S138 / S1541 / S1142)
    "C901",     # mccabe cyclomatic complexity (~ Sonar S1541)
    "PLR0911",  # too-many-return-statements   (~ Sonar S1142)
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments           (Sonar S107)
    "PLR0915",  # too-many-statements          (~ Sonar S138)
    # bugs / reliability
    "F",        # pyflakes — undefined names, unused imports/vars
    "B",        # flake8-bugbear — likely bugs (e.g. mutable defaults)
    "PLE",      # pylint errors
    # smells / readability
    "PLW",      # pylint warnings
    "SIM",      # flake8-simplify
    "N",        # pep8-naming (~ Sonar S100 / S101 / S116)
    "ERA",      # eradicate — commented-out code (~ Sonar S125)
]

[tool.ruff.lint.pylint]
max-args = 7  # SonarQube S107 parity (ruff default is 5)

[tool.ruff.lint.mccabe]
max-complexity = 10
